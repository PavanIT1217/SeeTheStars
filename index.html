<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>See the Stars</title>
  <meta name="description" content="A journey through the universe for curious minds – planets, stars, galaxies, black holes – and a sky finder that shows where they are right now.">
  <meta name="theme-color" content="#05060f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="See the Stars">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="nebula" aria-hidden="true"></div>

  <header class="topbar">
    <a class="logo" href="#/" aria-label="See the Stars – home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5" fill="#ffd36b"/><ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="#7fdcff" stroke-width="1.5" transform="rotate(-25 16 16)"/><circle cx="28" cy="10" r="1.6" fill="#fff"/></svg>
      <span>SEE THE STARS</span>
    </a>
    <span class="offline-pill">OFFLINE</span>
    <div id="xp-chip" class="xp-chip"></div>
    <a class="gear" href="#/saved" aria-label="Settings and saved items">⚙</a>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar glass" aria-label="Main">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 18 L9 9 L14 13 L20 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="18" r="2" fill="currentColor"/><circle cx="9" cy="9" r="2" fill="currentColor"/><circle cx="14" cy="13" r="2" fill="currentColor"/><circle cx="20" cy="5" r="2" fill="currentColor"/></svg><span>Journey</span></a>
    <a href="#/sky" data-tab="sky"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="1.8"/></svg><span>Sky Finder</span></a>
    <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="4" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="10" y="4" width="4" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M17 5l3.5 14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Library</span></a>
    <a href="#/saved" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Saved</span></a>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="fx" aria-hidden="true"></div>

  <noscript><p style="padding:2rem;color:#fff">See the Stars needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
