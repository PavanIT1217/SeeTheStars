<!-- See the Stars icon background: night sky over the curve of the Earth. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2a2a86"/><stop offset="0.45" stop-color="#14134a"/><stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7bff" stop-opacity="0"/><stop offset="0.5" stop-color="#9a7bff" stop-opacity="0.22"/><stop offset="1" stop-color="#5ad7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a4a"/><stop offset="1" stop-color="#040a16"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <path d="M-100 760 C 200 520, 600 300, 1124 120 L1124 330 C 640 470, 260 680, -100 980 Z" fill="url(#band)" filter="url(#blur)"/>
  <g fill="#ffffff">
    <circle cx="150" cy="170" r="5" opacity="0.9"/><circle cx="860" cy="150" r="4" opacity="0.8"/><circle cx="120" cy="560" r="3.5" opacity="0.7"/>
    <circle cx="905" cy="560" r="5" opacity="0.9"/><circle cx="300" cy="110" r="3" opacity="0.6"/><circle cx="720" cy="90" r="3" opacity="0.6"/>
    <circle cx="210" cy="380" r="2.5" opacity="0.6"/><circle cx="820" cy="370" r="2.5" opacity="0.6"/><circle cx="560" cy="130" r="2.5" opacity="0.5"/>
    <circle cx="70" cy="300" r="2.5" opacity="0.5"/><circle cx="960" cy="290" r="2.5" opacity="0.5"/>
  </g>
  <!-- the Earth's curve with an atmosphere glow -->
  <ellipse cx="512" cy="1420" rx="980" ry="560" fill="none" stroke="#5ad7ff" stroke-width="22" opacity="0.55" filter="url(#rim)"/>
  <ellipse cx="512" cy="1420" rx="980" ry="560" fill="url(#earth)"/>
  <ellipse cx="512" cy="1420" rx="980" ry="560" fill="none" stroke="#8fe9ff" stroke-width="5" opacity="0.8"/>
</svg>
